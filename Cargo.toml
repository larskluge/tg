[package]
name = "tg"
version = "0.18.0"
edition = "2024"
description = "A modern CLI tool for interacting with Telegram"
license = "MIT"

[dependencies]
tdlib-rs = { version = "1", features = ["download-tdlib"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
thiserror = "2"
async-trait = "0.1"
dirs = "6"
comfy-table = "7"
terminal_size = "0.3"
unicode-width = "0.2"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
libc = "0.2"
# A voice note's waveform: TDLib's JSON carries `bytes` as base64.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
# Paused time for the reaction poll's schedule tests.
tokio = { version = "1", features = ["full", "test-util"] }
